name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PR's runs share one group per branch, so a new push cancels the superseded
# run. Push and schedule runs each get their own group (the run id): GitHub keeps
# only one pending run per group, so a shared group would let a newer push
# replace a queued default-branch run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

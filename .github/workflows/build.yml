name: build

# Verifies the Dockerfile builds and the container actually boots on every
# PR / push. Doesn't push the image — that's release.yml on a tag. Catches
# Dockerfile breaks (lockfile drift, a source file never COPY'd in) before
# they reach a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build + load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: cordon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot smoke — the container must START and answer /healthz
        run: |
          set -eo pipefail
          docker run -d --name cordon --init -p 127.0.0.1:18080:8080 cordon:ci
          ok=0
          for _ in $(seq 1 12); do
            if [ -z "$(docker ps -q -f name=cordon -f status=running)" ]; then
              echo "::error::container exited during startup"; docker logs cordon; exit 1
            fi
            if curl -sf http://127.0.0.1:18080/healthz >/dev/null; then ok=1; break; fi
            sleep 5
          done
          echo "--- container logs ---"; docker logs cordon 2>&1 | head -40
          [ "$ok" = "1" ] || { echo "::error::cordon never answered /healthz"; exit 1; }
          # fail-closed surface: an unknown redaction set is refused and the upstream is never called
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/messages \
            -H 'content-type: application/json' -H 'x-api-key: ci' -H 'anthropic-version: 2023-06-01' \
            -H 'X-Redact-Sets: bogus' \
            -d '{"model":"claude-haiku-4-5","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}')
          [ "$code" = "400" ] || { echo "::error::unknown X-Redact-Sets returned $code, expected 400"; exit 1; }
          # a caller header can't switch redaction off
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/messages \
            -H 'content-type: application/json' -H 'x-api-key: ci' -H 'anthropic-version: 2023-06-01' \
            -H 'X-Redact-Mode: off' \
            -d '{"model":"claude-haiku-4-5","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}')
          [ "$code" = "403" ] || { echo "::error::X-Redact-Mode: off returned $code, expected 403"; exit 1; }
          # no ADMIN_TOKEN: admin API disabled, not open
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/admin/stats)
          [ "$code" = "403" ] || { echo "::error::/admin/stats without ADMIN_TOKEN returned $code, expected 403"; exit 1; }
          echo "boot smoke OK"
      - name: Teardown
        if: always()
        run: docker rm -f cordon || true

name: build

# Verifies the Dockerfile builds and the container actually boots on every
# PR / push. Doesn't push the image — that's release.yml on a tag. Catches
# Dockerfile breaks (lockfile drift, a source file never COPY'd in) before
# they reach a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # docker-build needs a Docker daemon, and cordon-exec has none (Docker on our host is root). So the
  # image job runs on GitHub's runners, on every push to the default branch and on a PR that
  # changes what the image is built from: the Dockerfile, .dockerignore, the package files,
  # tsconfig.json, src/, or this file. The required check docker-build runs on our runner and passes only when that
  # job passed or was not owed, so a PR that changes none of them never waits on GitHub's queue.
  docker-build-inputs:
    runs-on: ${{ github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","cordon-exec"]') }}
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: diff
        name: does the image depend on a changed file
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$files"
          if printf '%s\n' "$files" | grep -qE '^(Dockerfile|\.dockerignore|package(-lock)?\.json|tsconfig\.json|src/.*|\.github/workflows/build\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build-image:
    needs: docker-build-inputs
    if: needs.docker-build-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build + load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: cordon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot smoke — the container must START and answer /healthz
        run: |
          set -eo pipefail
          docker run -d --name cordon --init -p 127.0.0.1:18080:8080 cordon:ci
          ok=0
          for _ in $(seq 1 12); do
            if [ -z "$(docker ps -q -f name=cordon -f status=running)" ]; then
              echo "::error::container exited during startup"; docker logs cordon; exit 1
            fi
            if curl -sf http://127.0.0.1:18080/healthz >/dev/null; then ok=1; break; fi
            sleep 5
          done
          echo "--- container logs ---"; docker logs cordon 2>&1 | head -40
          [ "$ok" = "1" ] || { echo "::error::cordon never answered /healthz"; exit 1; }
          # fail-closed surface: an unknown redaction set is refused and the upstream is never called
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/messages \
            -H 'content-type: application/json' -H 'x-api-key: ci' -H 'anthropic-version: 2023-06-01' \
            -H 'X-Redact-Sets: bogus' \
            -d '{"model":"claude-haiku-4-5","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}')
          [ "$code" = "400" ] || { echo "::error::unknown X-Redact-Sets returned $code, expected 400"; exit 1; }
          # a caller header can't switch redaction off
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/messages \
            -H 'content-type: application/json' -H 'x-api-key: ci' -H 'anthropic-version: 2023-06-01' \
            -H 'X-Redact-Mode: off' \
            -d '{"model":"claude-haiku-4-5","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}')
          [ "$code" = "403" ] || { echo "::error::X-Redact-Mode: off returned $code, expected 403"; exit 1; }
          # no ADMIN_TOKEN: admin API disabled, not open
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/admin/stats)
          [ "$code" = "403" ] || { echo "::error::/admin/stats without ADMIN_TOKEN returned $code, expected 403"; exit 1; }
          echo "boot smoke OK"
      - name: Teardown
        if: always()
        run: docker rm -f cordon || true

  docker-build:
    needs: [docker-build-inputs, docker-build-image]
    if: always()
    runs-on: ${{ github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","cordon-exec"]') }}
    timeout-minutes: 5
    steps:
      - name: the image job passed, or no change owed one
        env:
          INPUTS: ${{ needs.docker-build-inputs.result }}
          CHANGED: ${{ needs.docker-build-inputs.outputs.changed }}
          IMAGE: ${{ needs.docker-build-image.result }}
        run: |
          echo "docker-build-inputs: $INPUTS (changed=$CHANGED), docker-build-image: $IMAGE"
          test "$INPUTS" = success
          if [ "$CHANGED" = true ]; then test "$IMAGE" = success; fi

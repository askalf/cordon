# ClusterFuzzLite — continuous fuzzing of cordon's trust boundary: the pipeline
# that parses UNTRUSTED prompt text. cordon is a fail-CLOSED compliance gateway,
# so a crash in detection or redaction is not a hang, it is a fail-open: the
# request either becomes a permanent 422 (a crafted prompt DoSes the gateway) or,
# under the FAIL_MODE=open escape hatch, the ORIGINAL body is forwarded upstream
# with the PII intact. Three targets:
#   detect_spans      — the deterministic catalog over hostile bytes; no throw
#                       contract at all, and every returned span must be
#                       well-formed, in-range, sorted, non-overlapping and from
#                       an active set (the offsets drive an in-place splice).
#                       Also the ReDoS surface — libFuzzer's timeout catches
#                       catastrophic backtracking in the regex catalog.
#   redact_leak       — the product guarantee: no value the detector claimed
#                       survives into the de-identified body, in either mode and
#                       for both providers, with no prototype pollution from a
#                       hostile leaf key.
#   reidentify_stream — the boundary-safe restorer: streaming a response through
#                       ANY chunk split must equal restoring it whole, so a
#                       placeholder cut across SSE frames is never emitted raw to
#                       the client (nor swallowed).
# Runs weekly + on demand; a discovered crash fails the job and is uploaded as
# an artifact. Targets live in ./fuzz, built by .clusterfuzzlite/build.sh
# (Jazzer.js). OpenSSF Scorecard credits the Fuzzing check from the
# .clusterfuzzlite/ config.
name: ClusterFuzzLite

on:
  schedule:
    - cron: '41 5 * * 1' # weekly, Monday 05:41 UTC (staggered off the :00 grid)
  workflow_dispatch:

permissions: read-all

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # JavaScript (Jazzer.js) has no native sanitizer — OSS-Fuzz rejects
        # address/memory/undefined for JS ("cannot be fuzzed with sanitizers"),
        # and the action's config rejects `none`. `coverage` is the value real
        # JS ClusterFuzzLite projects use with this action version.
        sanitizer: [coverage]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: 'batch'
          language: javascript
          sanitizer: ${{ matrix.sanitizer }}

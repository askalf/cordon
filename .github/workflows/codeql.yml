name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on cordon-exec, our non-root
    # one-job runners, so GitHub's hosted queue going down does not hold our PRs. A fork's PR
    # and a Dependabot PR run code nobody here wrote, and a fork repository has no cordon-exec
    # runners, so those stay on GitHub's runners.
    runs-on: ${{ (github.repository != 'askalf/cordon' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","cordon-exec"]') }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write # upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL sizes itself to the machine's RAM and cores; on our host every exec runner shares
      # one memory ceiling, so on our runner it gets 2G and two threads, on GitHub's its defaults.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          ram: ${{ runner.environment == 'self-hosted' && '2048' || '' }}
          threads: ${{ runner.environment == 'self-hosted' && '2' || '' }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          ram: ${{ runner.environment == 'self-hosted' && '2048' || '' }}
          threads: ${{ runner.environment == 'self-hosted' && '2' || '' }}
